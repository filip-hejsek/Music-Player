android.useAndroidX=true
org.gradle.jvmargs=-Xmx8192m

# Versioning
VERSION_NAME=1.8.4
VERSION_CODE=17

# APP_ID is the installed package / applicationId (Play Store, F-Droid, on-device identity).
# Set to a personal namespace so this fork doesn't collide with the upstream app.
APP_ID=io.github.filiphejsek.musicplayer

# APP_NAMESPACE is the internal Kotlin/R-class package. It matches the existing
# source tree (org/fossify/musicplayer/...) so it's kept as-is; renaming it would
# require renaming every source file's package declaration for no real benefit,
# since it's never user-visible or published anywhere.
APP_NAMESPACE=org.fossify.musicplayer
